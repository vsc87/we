<script>


const ad1 = "https://uplcm.com/4/11203139";
const ad2 = "https://uplcm.com/4/11203139";
const ad3 = "https://uplcm.com/4/11203139";
const ad4 = "https://uplcm.com/4/11203139";



    function getLink(type) {

      const links = {
        video: ad1,
        movie: ad2,
        chat: ad3,
        app: ad4
      };

      return links[type] || ad1;
    }


    let isProcessing = false;


    function handleClick(type) {

      if (isProcessing) {
        return;
      }

      isProcessing = true;

      const link = getLink(type);

      startLoading(link);
    }


    function startLoading(link) {

      const bar = document.getElementById("loadingBar");
      const box = document.getElementById("loadingBox");
      const text = document.getElementById("statusText");

      box.style.display = "block";

      text.innerText = "Preparing the link...";

      let progress = 0;

      bar.style.width = "0%";


      const interval = setInterval(function () {

        progress += 10;

        if (progress >= 100) {

          progress = 100;

          clearInterval(interval);

          bar.style.width = "100%";

          text.innerText = "Opening link...";


          setTimeout(function () {

           

            window.location.href = link;

          }, 500);

        }

        bar.style.width = progress + "%";

      }, 200);
    }


    const params = new URLSearchParams(
      window.location.search
    );

    const id = params.get("id");

    function playVideo(box) {

      if (!id || id.trim() === "") {

        alert("Video not found");

        return;
      }


      const video = document.getElementById("player");

      const videoURL =
        "https://cdn2.videy.co/" +
        encodeURIComponent(id.trim()) +
        ".mp4";


      video.src = videoURL;

      video.style.display = "block";


      const label = box.querySelector(".label");

      if (label) {
        label.style.display = "none";
      }


      video.play().catch(function () {

      });


      /*
       * Show Continue button after 8 seconds.
       */

      setTimeout(function () {

        showContinueBtn();

      }, 8000);


      /*
       * Prevent the video box from starting
       * the video again.
       */

      box.onclick = null;
    }


    function showContinueBtn() {

      const overlay =
        document.getElementById("overlayCTA");

      const btn =
        document.getElementById("continueBtn");

      const video =
        document.getElementById("player");


      if (!video.src) {
        return;
      }


      video.pause();

      overlay.classList.add("show");


      setTimeout(function () {

        btn.classList.add("show");

      }, 50);
    }
  </script>
